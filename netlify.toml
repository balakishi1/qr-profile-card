[build]
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/p/:slug"
  to = "/.netlify/functions/profile?slug=:slug"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
